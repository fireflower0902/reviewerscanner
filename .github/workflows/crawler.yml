name: Daily Campaign Crawler

on:
  schedule:
    # 매 시간의 0분에 실행 (1시간 간격 크롤링)
    - cron: '0 * * * *'
  # GitHub Actions 탭에서 수동으로도 실행할 수 있도록 버튼 생성
  workflow_dispatch: 

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub에서 내 코드 복사해오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 파이썬 환경 세팅
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      # 3. 파이썬 라이브러리 및 브라우저 컨트롤러 설치
      - name: Install dependencies
        run: |
          cd crawler
          pip install -r requirements.txt
          playwright install chromium

      # 3-1. 네트워크 진단: 강남맛집이 GitHub 서버에서 막히는 원인 확인용 (결과는 로그에만 출력)
      - name: Network diagnostics
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          H="https://xn--939au0g4vj8sq.net"
          W='status=%{http_code} connect=%{time_connect}s first_byte=%{time_starttransfer}s total=%{time_total}s remote_ip=%{remote_ip}\n'
          echo "== runner public IP / country"
          curl -sS -m 10 https://ipinfo.io/json | grep -E '"(ip|country|org)"' || true
          echo "== 강남맛집 홈페이지 GET"
          curl -sS -m 20 -o /dev/null -w "$W" -A "$UA" "$H/cp/?ca=20" || echo "FAILED curl_exit=$?"
          echo "== 강남맛집 목록 API POST (헤더 포함)"
          curl -sS -m 20 -o /dev/null -w "$W" -A "$UA" -X POST "$H/theme/go/_list_cmp_tpl.php" \
            -H "Referer: $H/cp/?ca=20" -H "Origin: $H" -H "X-Requested-With: XMLHttpRequest" \
            --data-urlencode "ca=2005" --data-urlencode "loca_prt=서울" --data-urlencode "local_1=전체" \
            --data-urlencode "local_2=서울" --data-urlencode "rpage=1" --data-urlencode "row_num=20" || echo "FAILED curl_exit=$?"
          echo "== 대조군: 같은 서버에서 정상 수집되는 국내 사이트"
          curl -sS -m 20 -o /dev/null -w "$W" -A "$UA" https://www.reviewplace.co.kr/ || echo "FAILED curl_exit=$?"
          curl -sS -m 20 -o /dev/null -w "$W" -A "$UA" https://www.google.com/ || echo "FAILED curl_exit=$?"

      # 4. 크롤러 실행 (결과는 Cloudflare R2에 업로드됨)
      - name: Run crawler aggregator
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          cd crawler
          python aggregator.py
