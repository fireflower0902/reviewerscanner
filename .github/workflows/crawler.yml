name: Daily Campaign Crawler

on:
  schedule:
    # 매 시간의 0분에 실행 (1시간 간격 크롤링)
    - cron: '0 * * * *'
  # GitHub Actions 탭에서 수동으로도 실행할 수 있도록 버튼 생성
  workflow_dispatch:

# 새 실행이 시작되면 같은 그룹의 이전 실행(멈춘 실행 포함)을 취소하고 대체한다.
# (예전에는 순서대로 대기하게 했는데, 한 실행이 멈추면 뒤따르는 정각 실행이 전부 막혔다)
concurrency:
  group: crawler
  cancel-in-progress: true

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 정상은 5~6분. 어떤 이유로 멈추면 30분 뒤 강제 종료(기본값은 6시간)

    steps:
      # 1. GitHub에서 내 코드 복사해오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 파이썬 환경 세팅
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      # 3. 파이썬 라이브러리 및 브라우저 컨트롤러 설치
      - name: Install dependencies
        run: |
          cd crawler
          pip install -r requirements.txt
          playwright install chromium

      # 4. 크롤러 실행 (결과는 Cloudflare R2에 업로드됨)
      - name: Run crawler aggregator
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          cd crawler
          python aggregator.py
